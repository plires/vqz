services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      - ..:/var/www/html
    depends_on:
      - db
      - mailpit

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vqz_2022
      MYSQL_USER: vqz
      MYSQL_PASSWORD: vqz_local
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backup-bdd/vqz.sql:/docker-entrypoint-initdb.d/vqz.sql:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
